name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: tests/run.sh
      - run: shellcheck scripts/*.sh tests/run.sh

  # O workflow inteiro sobre um Dockerfile bom, sem publicar e sem pedir implantação.
  build:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-image.yml
    with:
      context: tests/dockerfiles/good
      image: ghcr.io/c4u-tech/c4u-workflows-lib-test
      tag: ci
      build_args: |
        EXAMPLE=1
      push: false
      deploy: false
